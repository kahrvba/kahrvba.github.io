apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      containers:
      - name: nextjs
        image: 13.48.190.206:8082/nextjs-app:latest
        ports:
        - containerPort: 3000
      imagePullSecrets:
      - name: nexus-regcred
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
  namespace: webapps
spec:
  selector:
    app: nextjs-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: NodePort   # or LoadBalancer if you want external access
